<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f5c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Lee 的口說教練</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d1d1b;--mut:#6b6a65;--line:#e3e1da;--acc:#1f6f5c;--acc2:#e7f2ee;--warn:#a1462b;--warn2:#fbece6;--ok:#2d7a3a}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--card:#21211f;--ink:#ecebe6;--mut:#9d9b94;--line:#34332f;--acc:#5fc3a6;--acc2:#1d302a;--warn:#f08b6a;--warn2:#3a241c;--ok:#7bd08a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC",sans-serif;padding-bottom:calc(150px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 14px 8px}
.wrap{max-width:720px;margin:auto}
.top{display:flex;align-items:center;gap:8px}.top h1{font-size:17px;margin:0;flex:1}
main{padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
h2{font-size:16px;margin:0 0 8px}
label{font-size:13px;color:var(--mut);display:block;margin-top:8px}
input,select,textarea{font:inherit;width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--card);color:var(--ink)}
textarea{min-height:60px;resize:vertical}
button{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 12px;cursor:pointer;min-height:42px}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
@media (prefers-color-scheme:dark){button.pri{color:#0f1e19}}
button.on{background:var(--acc2);border-color:var(--acc);color:var(--acc);font-weight:600}
button:disabled{opacity:.45}
button.sm{min-height:32px;padding:4px 10px;font-size:13px;border-radius:8px;white-space:nowrap}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grow{flex:1 1 0;min-width:0}
.mut{color:var(--mut);font-size:13px}
.seg{display:flex;gap:6px}.seg button{flex:1}
.msg{border-radius:12px;padding:9px 12px;margin:8px 0;max-width:92%;white-space:pre-wrap;word-break:break-word}
.msg.t{background:var(--acc2)}.msg.u{background:var(--card);border:1px solid var(--line);margin-left:auto}
.msg .who{font-size:12px;color:var(--mut);margin-bottom:2px}
.sys{font-size:13px;color:var(--mut);text-align:center;margin:6px 0}
.diff{background:var(--warn2);border-radius:10px;padding:8px 10px;margin:6px 0;font-size:14px}
.w-ok{color:var(--ok)}.w-miss{color:var(--warn);text-decoration:underline wavy}.w-extra{color:var(--mut);text-decoration:line-through}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.mic{width:100%;min-height:58px;font-size:17px;border-radius:14px;user-select:none;-webkit-user-select:none;touch-action:none}
.mic.live{background:#c0392b;border-color:#c0392b;color:#fff}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}.meter i{display:block;height:100%;width:0;background:var(--acc);transition:width .08s}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#999;margin-right:6px}
.dot.ok{background:#2d9a4a}.dot.wait{background:#d79b00}.dot.err{background:#c0392b}
.hide{display:none!important}
.veilpart{filter:blur(6px);cursor:pointer;transition:filter .2s}
.hitem{border-bottom:1px solid var(--line);padding:8px 0;display:flex;gap:8px;align-items:center}
.hitem .grow div:first-child{font-weight:500}
.hview{white-space:pre-wrap;font-size:14px;background:var(--bg);border-radius:10px;padding:8px;margin-top:6px;max-height:50vh;overflow:auto}
.banner{background:var(--acc2);border-radius:10px;padding:8px 10px;font-size:14px;margin-bottom:10px}
details summary{cursor:pointer;color:var(--mut);font-size:14px}
</style>
</head>
<body>
<header><div class="wrap top"><h1>Lee 的口說教練</h1><span class="mut"><span class="dot" id="dot"></span><span id="stat">未連線</span></span><button class="sm hide" id="btnStop2">下課</button></div></header>
<main class="wrap">

  <section class="card" id="keyCard">
    <h2>第一次使用：貼上 Gemini API 金鑰</h2>
    <p class="mut" style="margin-top:0">金鑰只存在這台裝置的瀏覽器裡，不會傳到別處（只用來連 Google）。換手機或電腦要再貼一次。</p>
    <input id="key" type="password" autocomplete="off" placeholder="AQ. 或 AIza 開頭的金鑰">
    <div class="row" style="margin-top:8px"><button class="pri grow" id="saveKey">儲存</button></div>
  </section>

  <section class="card" id="syncCard">
    <div class="row"><h2 class="grow" style="margin:0">雲端同步</h2><span class="mut" id="syncStat">未連結</span></div>
    <p class="mut" style="margin:6px 0 8px">用你的 Google 帳號把金鑰和上課紀錄存在 Google Drive 的 App 專用空間（你在 Drive 看不到這個檔，其他 App 也讀不到），手機、電腦開起來都一樣。</p>
    <div class="row"><button class="grow" id="btnSync">連結 Google 帳號</button><button class="sm hide" id="btnSyncOff">取消連結</button></div>
  </section>

  <section class="card" id="histCard">
    <div class="row"><h2 class="grow" style="margin:0">上課紀錄</h2><span class="mut" id="histN"></span></div>
    <div id="histList" style="margin-top:6px"></div>
  </section>

  <section class="card" id="setCard">
    <h2>今天練什麼</h2>
    <div class="seg" id="modeSeg">
      <button data-mode="shadow" class="on">跟讀糾正</button>
      <button data-mode="role">情境對話</button>
      <button data-mode="free">自由聊天</button>
    </div>
    <div id="resumeBar" class="banner hide"></div>
    <label>情境／主題（可空白）</label>
    <input id="topic" placeholder="例：速食店點餐、換配料、問加購是什麼">
    <div id="shadowOpts">
      <label>要練的句子（可空白，空白就由老師出題；一行一句）</label>
      <textarea id="sentences" placeholder="I'll call you later.&#10;Can I get the burger without onions?"></textarea>
    </div>
    <details style="margin-top:10px"><summary>進階設定</summary>
      <label><input type="checkbox" id="blind" style="width:auto"> 盲跟讀：老師的句子先遮住，念完才顯示（點一下也能先看）</label>
      <label>說話方式</label>
      <select id="talk"><option value="ptt">按住說話（不戴耳機也穩定）</option><option value="hands">免持對話（建議戴耳機）</option></select>
      <label>老師聲音</label>
      <select id="voice"><option>Puck</option><option>Charon</option><option>Kore</option><option>Fenrir</option><option>Aoede</option><option>Leda</option><option>Orus</option><option>Zephyr</option></select>
      <label>模型</label>
      <input id="model" value="gemini-3.8-live">
      <p class="mut">模型被停用時改這裡，例如 gemini-3-flash-live（以 AI Studio 額度頁列出的 Live 模型名稱為準）。</p>
      <div class="row"><button class="sm" id="clearKey">刪除本機金鑰</button></div>
    </details>
    <div class="row" style="margin-top:12px"><button class="pri grow" id="btnStart">開始上課</button><button class="grow hide" id="btnStop">下課</button></div>
  </section>

  <section class="card hide" id="chatCard">
    <div class="row"><h2 class="grow" style="margin:0">對話紀錄</h2><button class="sm" id="btnCopy">複製紀錄</button></div>
    <div id="log"></div>
  </section>
</main>

<div class="dock hide" id="dock"><div class="wrap">
  <button class="mic" id="mic">按住說話</button>
  <div class="meter"><i id="lvl"></i></div>
  <div class="row" style="margin-top:6px">
    <input id="txt" class="grow" placeholder="也可以打字（中文問也行）">
    <button class="sm" id="btnTxt">送出</button>
    <button class="sm" id="btnAgain">再一句</button>
    <button class="sm" id="btnBeep" title="測試喇叭">🔊</button>
  </div>
</div></div>

<script>
"use strict";
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- settings ---------- */
const CFG=Object.assign({mode:"shadow",topic:"",sentences:"",talk:"ptt",voice:"Puck",model:"gemini-3.8-live",blind:false},LS.get("coach_cfg",{}));
function saveCfg(){LS.set("coach_cfg",CFG)}
(function(){try{const q=new URLSearchParams(location.search);let n=0;
  if(q.get("topic"))CFG.topic=q.get("topic");
  if(q.get("s")){const list=q.get("s").split("|").map(x=>x.trim()).filter(Boolean);CFG.sentences=list.join("\n");n=list.length;CFG.mode="shadow"}
  if(["shadow","role","free"].includes(q.get("mode")))CFG.mode=q.get("mode");
  if(n||q.get("topic")){saveCfg();window.__fromLib=n;history.replaceState(null,"",location.pathname)}
}catch(e){}})();
$("#blind").checked=!!CFG.blind;$("#blind").onchange=e=>{CFG.blind=e.target.checked;saveCfg()};
$("#topic").value=CFG.topic;$("#sentences").value=CFG.sentences;
if(window.__fromLib){const b=document.createElement("div");b.className="banner";b.textContent=`已從聽力庫載入 ${window.__fromLib} 句關鍵句，直接按「開始上課」。`;$("#setCard").prepend(b)}$("#talk").value=CFG.talk;$("#voice").value=CFG.voice;$("#model").value=CFG.model;
function setMode(m){CFG.mode=m;$$("#modeSeg button").forEach(b=>b.classList.toggle("on",b.dataset.mode===m));$("#shadowOpts").classList.toggle("hide",m!=="shadow");saveCfg()}
setMode(CFG.mode);
$$("#modeSeg button").forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
["topic","sentences","talk","voice","model"].forEach(id=>$("#"+id).addEventListener("change",e=>{CFG[id]=e.target.value.trim()||CFG[id];saveCfg();if(id==="talk")updateMicLabel()}));
function refreshKeyCard(){const has=!!LS.get("coach_key","");$("#keyCard").classList.toggle("hide",has)}
$("#saveKey").onclick=()=>{let k=$("#key").value.trim();k=k.replace(/\s+/g,"");if(!/^(AQ\.|AIza)[\w.\-]{20,}$/.test(k)){alert2("金鑰格式不對：應該是 AQ. 或 AIza 開頭的一長串，請重新複製。");return}LS.set("coach_key",k);$("#key").value="";refreshKeyCard();if(SYNC.on)syncPush()};
$("#clearKey").onclick=()=>{LS.del("coach_key");refreshKeyCard()};
refreshKeyCard();
function alert2(m){sys(m,true)}

/* ---------- prompts ---------- */
const BASE=`You are Lee's English speaking coach. Lee is an adult Taiwanese learner (around CEFR A2-B1, small vocabulary), a construction site manager. Speak clear, natural American English at a slightly slow pace. Never use the name "Kevin".
HONESTY RULES: Never open with praise. No "great", "perfect", "excellent". Be specific and direct.
LANGUAGE: Teach in English. If Lee speaks or types Chinese, answer that part briefly in Traditional Chinese (台灣用語), then return to English.
CONSTRUCTION GLOSSARY (Taiwan site terms -> correct English; never translate 計價 as "pricing"):
計價/估驗計價 = progress payment / payment application (interim valuation); 追加減 = change orders (variations), 追加 = addition, 追減 = deduction; 結算 = final account / final settlement; 業主 = client / owner; 分包/協力廠商 = subcontractor; 會議記錄 = meeting minutes; 請購單 = purchase requisition (PR); 報價 = quotation; 試車 = commissioning; 驗收 = acceptance inspection; 缺失 = punch list items / defects (drywall: out of plumb, not flat / uneven surface, cracks, visible joints); 施工圖 = shop drawings; 竣工圖 = as-built drawings; 工期 = construction schedule; 機電 = MEP; 無塵室 = cleanroom.
If you are not sure of a Taiwan construction term, say so and give the closest options instead of guessing.
DO NOT INVENT: never add details Lee did not say (floor, location, cause, quantity, people). If his sentence is cut off, ask him to finish it.
LEE'S INSTRUCTIONS COME FIRST: if Lee asks a question, asks you to translate, to slow down, to explain a word, says "let's practice the whole conversation", or talks in Chinese about the lesson, that is NOT a repeat attempt. Do what he asks, then continue. "Practice the whole conversation" = go back through the useful sentences from this session, one at a time, each with "Repeat after me:".
UNCLEAR AUDIO: if what you heard sounds like another language, random words, or noise, say "I didn't catch that clearly, please say it again" and do not grade it.
YOU CANNOT SEE THE APP'S WORD COMPARISON. Never say "5/5", "all scores", "zero differences", "perfect", "spot on" or "excellent". Do not give numeric scores at all.
AFTER EVERY REPEAT ATTEMPT answer in this order, short:
1) 用字：in Traditional Chinese (台灣用語), list each missing, changed or extra word you heard, keeping the English words in quotes (e.g. 用字：你說成 "defense"，應該是 "defects"。), or say "用字：我聽到的都對。"
2) 發音：in Traditional Chinese, exactly ONE concrete note about speed, stress, intonation, pauses or linking, naming the exact English word in quotes (e.g. 發音："defects" 重音在第一音節 DE-fects。 / 發音："the site management" 要連成一口氣，不要在 "the" 後面停。 / 發音：句尾聲調上揚了，直述句要往下降。). This line is mandatory even when the words are right. If a word sounded like a different word, say what it sounded like. Never tell him to pause inside a phrasal verb or a fixed phrase ("catch up on", "pick it up"): those are linked together.
Keep lines 1) and 2) short: one sentence each. Speak them in Chinese, then switch back to English.
3) In English: if any word was wrong, say "Repeat after me:" with the same sentence (max 3 tries, then move on). Otherwise move on.
SYNONYMS: if Lee uses a correct, natural synonym (e.g. "uneven" for "unlevel", "I'm" for "I am"), accept it: mention the target word once and do not make him repeat for it.
When you give Lee a NEW sentence to read, always say "Repeat after me:" right before it.`;
function resumeContext(){
  const h=HIST.find(x=>x.id===CFG.resumeId);if(!h)return "";
  const lines=h.log.filter(r=>r.w!=="diff").slice(-40).map(r=>(r.w==="teacher"?"Teacher: ":"Lee: ")+String(r.t).trim().slice(0,220)).join("\n");
  return `\nPREVIOUS SESSION (${h.date.slice(0,10)}, ${h.topic||h.mode}): Lee wants to continue from it and may ask about things discussed there. Start by briefly reminding him where you left off. Transcript excerpt:\n${lines}\n`;
}
function buildPrompt(){return buildPrompt0()+resumeContext()}
function buildPrompt0(){
  const topic=CFG.topic?`Topic/scenario: ${CFG.topic}.`:"";
  if(CFG.mode==="shadow"){
    const list=CFG.sentences.split(/\n+/).map(s=>s.trim()).filter(Boolean);
    return BASE+`\nMODE: shadowing drill. ${topic}\n`+(list.length?`Use these sentences in order, one at a time:\n${list.map((s,i)=>`${i+1}. ${s}`).join("\n")}\nAfter the list is done, make similar sentences on the same topic.`:`Choose short, useful everyday sentences (6-12 words), gradually harder.`)+`\nMove to the next sentence when the words are right and the sound note is minor, or after 3 tries; when moving on, give one phrase variation Lee could also use.`;
  }
  if(CFG.mode==="role")return BASE+`\nMODE: role-play. ${topic||"Scenario: ordering at a fast-food counter, asking to swap ingredients and asking what add-ons are."}\nYou play the other person and keep the conversation going with short turns. After each Lee turn, step out of role in ONE short line IN TRADITIONAL CHINESE (keep English words in quotes): fix grammar/word choice if needed, and give the single most important pronunciation note (stress, intonation, linking, speed, or a misheard word). Every 3 turns, offer 2 other natural ways to say something Lee said, then say "Repeat after me:" for one of them.`;
  return BASE+`\nMODE: free conversation. ${topic}\nChat naturally, ask follow-up questions. After each Lee turn add one short correction line IN TRADITIONAL CHINESE (keep English words in quotes; grammar or pronunciation) only if needed, then continue in English.`;
}

/* ---------- log ---------- */
const LOG=[];let cur={t:null,u:null};
function addMsg(who,text){
  const box=$("#log");const el=document.createElement("div");el.className="msg "+(who==="teacher"?"t":"u");
  el.innerHTML=`<div class="who">${who==="teacher"?"老師":"你（辨識結果）"}</div><span></span>`;
  el.querySelector("span").textContent=text;box.appendChild(el);el.scrollIntoView({block:"nearest",behavior:"smooth"});
  if(who==="me")$$(".veilpart").forEach(x=>x.classList.remove("veilpart"));
  const rec={who,text,el};LOG.push(rec);dirty=true;return rec;
}
function appendTo(kind,delta){
  if(!delta)return;
  if(!cur[kind]){cur[kind]=addMsg(kind==="t"?"teacher":"me","");}
  cur[kind].text+=delta;dirty=true;cur[kind].el.querySelector("span").textContent=cur[kind].text;
  cur[kind].el.scrollIntoView({block:"nearest"});
}
function sys(m,warn){const d=document.createElement("div");d.className="sys";d.style.color=warn?"var(--warn)":"";d.textContent=m;$("#chatCard").classList.remove("hide");$("#log").appendChild(d);d.scrollIntoView({block:"nearest"})}
$("#btnCopy").onclick=async()=>{const t=LOG.map(r=>r.who==="diff"?r.text:(r.who==="teacher"?"Teacher: ":"Lee: ")+r.text.trim()).join("\n");try{await navigator.clipboard.writeText(t);sys("已複製，可以貼給 Claude 整理成筆記。")}catch(e){sys("複製失敗，請長按紀錄自行選取。",true)}};

/* ---------- target sentence diff ---------- */
let target="",expectRepeat=false;
const NUM={"0":"zero","1":"one","2":"two","3":"three","4":"four","5":"five","6":"six","7":"seven","8":"eight","9":"nine","10":"ten","11":"eleven","12":"twelve"};
const norm=s=>String(s||"").toLowerCase().replace(/[’‘`]/g,"'").replace(/'/g,"").replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim();
const toks=s=>norm(s).split(" ").filter(Boolean).map(w=>NUM[w]||w);
function diffWords(t,h){
  const a=toks(t),b0=toks(h),b=[];
  for(let j=0;j<b0.length;j++){if(j+1<b0.length&&!a.includes(b0[j])&&a.includes(b0[j]+b0[j+1])){b.push(b0[j]+b0[j+1]);j++}else b.push(b0[j])}
  const n=a.length,m=b.length,dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const out=[];let i=0,j=0;
  while(i<n||j<m){if(i<n&&j<m&&a[i]===b[j]){out.push(["ok",a[i]]);i++;j++}else if(j<m&&(i>=n||dp[i][j+1]>=dp[i+1][j])){out.push(["extra",b[j]]);j++}else{out.push(["miss",a[i]]);i++}}
  return {out,score:n?Math.round(out.filter(x=>x[0]==="ok").length/n*100):0};
}
function veilTarget(rec){
  const sp=rec.el.querySelector("span"),t=rec.text,i=t.search(/repeat after me/i);if(i<0)return;
  const j=t.indexOf(":",i)>-1?t.indexOf(":",i)+1:i+15;
  sp.textContent="";sp.append(document.createTextNode(t.slice(0,j)+" "));
  const v=document.createElement("span");v.className="veilpart";v.textContent=t.slice(j).trim();v.title="點一下先看";v.onclick=()=>v.classList.remove("veilpart");sp.append(v);
}
function extractTarget(text){
  const m=String(text).match(/repeat after me[:,.]?\s*["“]?([^"”\n]+?[.?!])/i);
  if(m){const s=m[1].trim();if(s.split(/\s+/).length>=2){if(s!==target)tries=0;target=s;expectRepeat=true}}
}
let tries=0;
function showDiff(heard){
  if(!target)return;
  const raw=String(heard||"").trim();
  if(/[\u3400-\u9fff]/.test(raw))return; // Chinese = a question/instruction, not an attempt
  const hb=toks(raw);if(!hb.length)return;
  const foreign=/[\u00c0-\u024f¿¡]/.test(raw);
  const d=diffWords(target,raw);
  // first attempt after "Repeat after me" is always compared; later turns only if they look like another try
  if(!expectRepeat&&(foreign||d.score<40||tries>=4))return;
  expectRepeat=false;tries++;
  const el=document.createElement("div");el.className="diff";
  if(foreign){el.innerHTML=`<b>辨識成外語</b>　聽到：${esc(raw)}<div class="mut">通常是雜音、太小聲或話太短。靠近麥克風、整句說完再放開。這次不算分。</div>`;$("#log").appendChild(el);el.scrollIntoView({block:"nearest"});
    LOG.push({who:"diff",text:`[辨識成外語] 目標：${target}｜聽到：${raw}`,el});expectRepeat=true;tries--;return}
  el.innerHTML=`<b>辨識比對 ${d.score}%</b>　目標：${esc(target)}<br>`+d.out.map(([k,w])=>`<span class="w-${k}">${esc(w)}</span>`).join(" ")+(d.score<100?`<div class="mut">紅底線＝沒被聽出來；刪除線＝被聽成的字。這是語音辨識結果，和老師的評語互相對照。老師看不到這個比對，它說的分數不算數。</div>`:"");
  $("#log").appendChild(el);el.scrollIntoView({block:"nearest"});
  LOG.push({who:"diff",text:`[辨識比對 ${d.score}%] 目標：${target}｜聽到：${raw}｜漏掉：${d.out.filter(x=>x[0]==="miss").map(x=>x[1]).join(" ")||"無"}｜多出：${d.out.filter(x=>x[0]==="extra").map(x=>x[1]).join(" ")||"無"}`,el});
}

/* ---------- audio out (24k PCM) ---------- */
let outCtx=null,playHead=0;const playing=new Set();
function ensureOut(){if(!outCtx){const AC=window.AudioContext||window.webkitAudioContext;outCtx=new AC()}if(outCtx.state==="suspended")outCtx.resume();return outCtx}
let audioChunks=0;
function playPCM(b64){
  const ctx=ensureOut();audioChunks++;
  if(ctx.state!=="running"&&!document.querySelector("#unmute")){const d=document.createElement("button");d.id="unmute";d.className="pri";d.style.cssText="width:100%;margin:6px 0";d.textContent="🔇 老師的聲音被瀏覽器擋住了，點這裡恢復";d.onclick=()=>{outCtx.resume();d.remove()};$("#log").appendChild(d)}const bin=atob(b64);const len=bin.length>>1;if(!len)return;
  const buf=ctx.createBuffer(1,len,24000);const ch=buf.getChannelData(0);
  for(let i=0;i<len;i++){let v=bin.charCodeAt(i*2)|(bin.charCodeAt(i*2+1)<<8);if(v>=32768)v-=65536;ch[i]=v/32768}
  const src=ctx.createBufferSource();src.buffer=buf;src.connect(ctx.destination);
  playHead=Math.max(playHead,ctx.currentTime+0.05);src.start(playHead);playHead+=buf.duration;
  playing.add(src);src.onended=()=>playing.delete(src);
}
function stopPlayback(){playing.forEach(s=>{try{s.stop()}catch(e){}});playing.clear();if(outCtx)playHead=outCtx.currentTime}
const teacherSpeaking=()=>outCtx&&playHead>outCtx.currentTime+0.02;

/* ---------- audio in (16k PCM) ---------- */
let inCtx=null,stream=null,node=null,sending=false;
const WORKLET=`class P extends AudioWorkletProcessor{constructor(){super();this.buf=[];this.ratio=sampleRate/16000;this.pos=0;}
process(inputs){const ch=inputs[0]&&inputs[0][0];if(!ch)return true;let peak=0;
for(let i=0;i<ch.length;i++){const a=Math.abs(ch[i]);if(a>peak)peak=a}
// linear resample to 16k
const out=[];while(this.pos<ch.length){const i=Math.floor(this.pos),f=this.pos-i;const s=ch[i]*(1-f)+(ch[i+1]!==undefined?ch[i+1]:ch[i])*f;out.push(s);this.pos+=this.ratio}
this.pos-=ch.length;for(const s of out)this.buf.push(Math.max(-1,Math.min(1,s)));
if(this.buf.length>=1600){const n=this.buf.length,pcm=new Int16Array(n);for(let i=0;i<n;i++)pcm[i]=this.buf[i]*32767;this.buf=[];this.port.postMessage({pcm:pcm.buffer,peak},[pcm.buffer])}
else this.port.postMessage({peak});return true}}
registerProcessor("pcm16k",P);`;
async function ensureMic(){
  if(node)return true;
  try{
    const ec=CFG.talk!=="ptt";stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:ec,noiseSuppression:true,autoGainControl:true,channelCount:1}});
  }catch(e){sys("拿不到麥克風權限："+(e.message||e.name)+"。請在瀏覽器設定允許這個網站使用麥克風。",true);return false}
  const AC=window.AudioContext||window.webkitAudioContext;inCtx=new AC();
  const url=URL.createObjectURL(new Blob([WORKLET],{type:"application/javascript"}));
  await inCtx.audioWorklet.addModule(url);
  const src=inCtx.createMediaStreamSource(stream);node=new AudioWorkletNode(inCtx,"pcm16k");
  node.port.onmessage=e=>{
    const {pcm,peak}=e.data;$("#lvl").style.width=Math.min(100,peak*160)+"%";
    if(pcm&&sending&&ws&&ws.readyState===1){
      if(CFG.talk==="hands"&&teacherSpeaking()&&peak<0.08)return; // reduce echo self-interrupt
      ws.send(JSON.stringify({realtimeInput:{audio:{data:b64(pcm),mimeType:"audio/pcm;rate=16000"}}}));
    }
  };
  src.connect(node);// worklet needs no output connection on most browsers; keep a silent sink for Safari
  const g=inCtx.createGain();g.gain.value=0;node.connect(g);g.connect(inCtx.destination);
  return true;
}
function b64(ab){const u=new Uint8Array(ab);let s="";for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
function releaseMic(){try{stream&&stream.getTracks().forEach(t=>t.stop())}catch(e){}try{inCtx&&inCtx.close()}catch(e){}stream=null;inCtx=null;node=null;sending=false}

/* ---------- websocket session ---------- */
let ws=null,want=false,handle=null,retries=0,setupDone=false;
let TX=+(LS.get("coach_tx","2")); // 2 = English+Chinese + vocabulary, 1 = vocabulary only, 0 = default
const VOCAB=["subcontractor","subcontractors","punch list","defects","drywall","MEP","cleanroom","commissioning","progress payment","change order","as-built drawings","shop drawings","meeting minutes","purchase requisition","quotation","main contractor","construction schedule","vertical alignment","out of plumb","unlevel","crane","lifting","overtime","Certainly"];
function txCfg(){if(TX>=2)return {languageCodes:["en-US","zh-TW"],customVocabulary:VOCAB};if(TX===1)return {customVocabulary:VOCAB};return {}}
const WS_URL="wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=";
function status(t,k){$("#stat").textContent=t;$("#dot").className="dot "+(k||"")}
function connect(){
  const key=LS.get("coach_key","");if(!key){refreshKeyCard();sys("請先貼上金鑰。",true);return}
  setupDone=false;status("連線中…","wait");
  ws=new WebSocket(WS_URL+encodeURIComponent(key));
  ws.onopen=()=>{
    const setup={model:"models/"+CFG.model,
      generationConfig:{responseModalities:["AUDIO"],speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:CFG.voice}}}},
      systemInstruction:{parts:[{text:buildPrompt()}]},
      inputAudioTranscription:txCfg(),outputAudioTranscription:{},
      contextWindowCompression:{slidingWindow:{}},
      sessionResumption:handle?{handle}:{}};
    if(CFG.talk==="ptt")setup.realtimeInputConfig={automaticActivityDetection:{disabled:true}};
    ws.send(JSON.stringify({setup}));
  };
  ws.onmessage=async ev=>{
    let txt=typeof ev.data==="string"?ev.data:await ev.data.text();let m;try{m=JSON.parse(txt)}catch(e){return}
    if(m.setupComplete){
      setupDone=true;setupDoneEver=true;retries=0;status("上課中","ok");
      if(!resumed){resumed=true;sendText(CFG.mode==="shadow"?"Hi, I'm ready. Please start.":"Hi! Let's start.",true)}
      else if(freshResume){freshResume=false;const recent=LOG.filter(r=>r.who!=="diff").slice(-6).map(r=>(r.who==="teacher"?"Teacher: ":"Lee: ")+r.text.trim()).join("\n");sendText("(Connection was reset. Continue the same lesson from here. Recent conversation:\n"+recent+")",true)}
      return;
    }
    if(m.sessionResumptionUpdate&&m.sessionResumptionUpdate.resumable&&m.sessionResumptionUpdate.newHandle)handle=m.sessionResumptionUpdate.newHandle;
    if(m.goAway){sys("連線即將到期，自動接續中…")}
    const sc=m.serverContent;if(!sc)return;
    if(sc.interrupted){stopPlayback();cur.t=null}
    if(sc.inputTranscription&&sc.inputTranscription.text){cur.t=null;appendTo("u",sc.inputTranscription.text)}
    if(sc.outputTranscription&&sc.outputTranscription.text){if(cur.u){finishUser()}appendTo("t",sc.outputTranscription.text)}
    if(sc.modelTurn&&sc.modelTurn.parts)for(const p of sc.modelTurn.parts){if(p.inlineData&&p.inlineData.data&&/audio/.test(p.inlineData.mimeType||"audio"))playPCM(p.inlineData.data);else if(p.text&&!sc.outputTranscription){/* text parts are thoughts or text; ignore */}}
    if(sc.turnComplete){if(cur.u)finishUser();if(cur.t){extractTarget(cur.t.text);if(CFG.blind)veilTarget(cur.t)}cur.t=null}
  };
  ws.onerror=()=>{};
  ws.onclose=ev=>{
    setupDone=false;sending=false;setMicUI(false);
    if(!want){status("未連線");return}
    const reason=ev.reason||"";
    console.log("ws close",ev.code,reason);
    if(/API[_ ]?key|PERMISSION_DENIED|UNAUTHENTICATED/i.test(reason)){status("金鑰錯誤","err");sys("金鑰無效或沒有權限："+reason,true);want=false;stopUI();return}
    if(!setupDoneEver&&TX>0&&(ev.code===1007||/invalid|unknown name|language|vocabulary/i.test(reason))){TX--;LS.set("coach_tx",String(TX));console.log("transcription config downgraded to",TX);setTimeout(()=>want&&connect(),300);return}
    if(/not found|not supported/i.test(reason)&&!setupDoneEver){status("模型錯誤","err");sys("模型「"+CFG.model+"」無法使用："+reason+"。請到進階設定改模型名稱。",true);want=false;stopUI();return}
    if(/RESOURCE_EXHAUSTED|quota/i.test(reason)){status("額度用完","err");sys("免費額度暫時用完："+reason+"。等一下再試。",true);want=false;stopUI();return}
    if(/already connected/i.test(reason)){handle=null;freshResume=true} /* old session still held by server: start a fresh one */
    if(retries>=4){status("連線失敗","err");sys("一直連不上（"+ev.code+" "+reason+"）。檢查網路後按「開始上課」重試。",true);want=false;stopUI();return}
    retries++;status("重新連線…","wait");sys("連線中斷（"+ev.code+(reason?" "+reason.slice(0,60):"")+"），自動接續中…");
    setTimeout(()=>want&&connect(),1500*retries);
  };
}
let resumed=false,setupDoneEver=false,freshResume=false;
function finishUser(){const u=cur.u;cur.u=null;if(u)showDiff(u.text)}
function sendText(t,silent){
  if(!ws||ws.readyState!==1||!setupDone){sys("還沒連上，稍等。",true);return}
  if(!silent)addMsg("me",t);
  stopPlayback();
  ws.send(JSON.stringify({clientContent:{turns:[{role:"user",parts:[{text:t}]}],turnComplete:true}}));
}

/* ---------- UI flow ---------- */
async function start(){
  CFG.topic=$("#topic").value.trim();CFG.sentences=$("#sentences").value;CFG.model=$("#model").value.trim()||"gemini-3.8-live";CFG.voice=$("#voice").value;CFG.talk=$("#talk").value;saveCfg();
  if(!LS.get("coach_key","")){refreshKeyCard();return}
  ensureOut();
  if(!await ensureMic())return;
  $("#log").innerHTML="";LOG.length=0;cur={t:null,u:null};target="";handle=null;resumed=false;retries=0;
  SESSION={id:"s"+Date.now(),date:new Date().toISOString(),mode:CFG.mode,topic:CFG.topic,resumeOf:CFG.resumeId||""};
  if(SYNC.on&&SYNC.token&&Date.now()<SYNC.exp-60000)syncPull();
  want=true;$("#setCard").classList.add("hide");$("#btnStop2").classList.remove("hide");$("#chatCard").classList.remove("hide");$("#dock").classList.remove("hide");$("#btnStart").classList.add("hide");$("#btnStop").classList.remove("hide");
  setupDoneEver=false;updateMicLabel();connect();
}
function stopUI(){$("#setCard").classList.remove("hide");$("#btnStop2").classList.add("hide");$("#btnStart").classList.remove("hide");$("#btnStop").classList.add("hide");$("#dock").classList.add("hide");releaseMic()}
function stop(){want=false;stopPlayback();try{ws&&ws.close()}catch(e){}stopUI();status("未連線");saveSession(true);setResume("");sys("下課。紀錄已存到「上課紀錄」"+(SYNC.on?"並同步到雲端。":"（只存在這台裝置）。"))}
$("#btnStart").onclick=start;$("#btnStop").onclick=stop;$("#btnStop2").onclick=stop;
$("#btnTxt").onclick=()=>{const t=$("#txt").value.trim();if(!t)return;$("#txt").value="";sendText(t)};
$("#txt").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.isComposing){e.preventDefault();$("#btnTxt").click()}});
$("#btnBeep").onclick=()=>{const c=ensureOut();const o=c.createOscillator(),g=c.createGain();g.gain.value=0.2;o.frequency.value=660;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+0.4);sys("播放測試音（"+c.state+"），收到老師語音 "+audioChunks+" 段。聽不到請檢查手機音量或靜音模式。")};
$("#btnAgain").onclick=()=>sendText(CFG.mode==="shadow"?"Next sentence, please.":"Please continue.",false);

function updateMicLabel(){setMicUI(sending)}
function setMicUI(on){const b=$("#mic");b.classList.toggle("live",on);b.textContent=CFG.talk==="ptt"?(on?"放開＝說完":"按住說話"):(on?"🎙 收音中（點一下暫停）":"點一下開始說話")}
function micDown(){
  if(!setupDone)return;
  stopPlayback();
  if(CFG.talk==="ptt"){sending=true;ws.send(JSON.stringify({realtimeInput:{activityStart:{}}}))}
  else{sending=!sending;if(!sending&&ws&&ws.readyState===1)ws.send(JSON.stringify({realtimeInput:{audioStreamEnd:true}}))}
  setMicUI(sending);
}
function micUp(){
  if(CFG.talk!=="ptt"||!sending)return;
  // let the last ~100ms chunk flush, then mark end of speech
  setTimeout(()=>{sending=false;setMicUI(false);if(ws&&ws.readyState===1)ws.send(JSON.stringify({realtimeInput:{activityEnd:{}}}))},150);
}
const mic=$("#mic");
mic.addEventListener("pointerdown",e=>{e.preventDefault();try{mic.setPointerCapture(e.pointerId)}catch(_){};micDown()});
mic.addEventListener("pointerup",e=>{e.preventDefault();micUp()});
mic.addEventListener("pointercancel",micUp);
mic.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("visibilitychange",()=>{if(document.hidden&&sending&&CFG.talk==="ptt")micUp()});

/* ---------- history (local + Google Drive appData sync) ---------- */
const GCLIENT="270792877647-dncsnf3mjhmr9kplvu3kvc99auooovvb.apps.googleusercontent.com";
let HIST=LS.get("coach_hist",[]),SESSION=null,dirty=false;
function persistLocal(){HIST.sort((a,b)=>b.id.localeCompare(a.id));HIST=HIST.slice(0,150);LS.set("coach_hist",HIST)}
function saveSession(push){
  if(!SESSION||!LOG.length){return}
  const log=LOG.map(r=>({w:r.who,t:String(r.text).slice(0,2000)}));
  const rec=Object.assign({},SESSION,{log,turns:log.filter(r=>r.w==="me").length,updated:Date.now()});
  HIST=HIST.filter(x=>x.id!==rec.id);HIST.unshift(rec);persistLocal();renderHist();dirty=false;
  if(push&&SYNC.on)syncPush();
}
setInterval(()=>{if(want&&dirty)saveSession(true)},90000);
document.addEventListener("visibilitychange",()=>{if(document.hidden&&dirty)saveSession(true)});
const MODEN={shadow:"跟讀",role:"情境對話",free:"自由聊天"};
function renderHist(){
  $("#histN").textContent=HIST.length?`${HIST.length} 堂`:"";
  $("#histList").innerHTML=HIST.slice(0,30).map(h=>{const d=new Date(h.date);return `<div class="hitem" data-id="${h.id}"><div class="grow"><div>${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}｜${esc(MODEN[h.mode]||h.mode)}${h.topic?"｜"+esc(h.topic):""}</div><div class="mut">你講了 ${h.turns||0} 次</div></div><button class="sm" data-view>查看</button><button class="sm" data-resume>接續</button></div>`}).join("")||'<div class="mut">還沒有紀錄。上完一堂課會自動存在這裡。</div>';
  $$("#histList [data-view]").forEach(b=>b.onclick=()=>{const it=b.closest(".hitem"),h=HIST.find(x=>x.id===it.dataset.id);const old=it.nextElementSibling;if(old&&old.classList.contains("hview")){old.remove();return}
    const v=document.createElement("div");v.className="hview";v.textContent=h.log.map(r=>r.w==="diff"?r.t:(r.w==="teacher"?"Teacher: ":"Lee: ")+r.t.trim()).join("\n");
    const c=document.createElement("button");c.className="sm";c.textContent="複製";c.style.marginTop="6px";c.onclick=async()=>{try{await navigator.clipboard.writeText(v.textContent);c.textContent="已複製"}catch(e){c.textContent="複製失敗"}};v.appendChild(document.createElement("br"));v.appendChild(c);it.after(v)});
  $$("#histList [data-resume]").forEach(b=>b.onclick=()=>{const h=HIST.find(x=>x.id===b.closest(".hitem").dataset.id);setResume(h.id);if(h.topic&&!$("#topic").value)$("#topic").value=h.topic;setMode(h.mode);$("#setCard").scrollIntoView({behavior:"smooth"})});
}
function setResume(id){CFG.resumeId=id||"";saveCfg();const bar=$("#resumeBar"),h=HIST.find(x=>x.id===id);
  if(!h){bar.classList.add("hide");return}
  const d=new Date(h.date);bar.innerHTML=`接續 ${d.getMonth()+1}/${d.getDate()} 的課（${esc(h.topic||MODEN[h.mode]||"")}），老師會先帶你回顧。 <button class="sm" id="resumeX">取消</button>`;bar.classList.remove("hide");$("#resumeX").onclick=()=>setResume("")}
function mergeHist(remote){const m=new Map();HIST.forEach(h=>m.set(h.id,h));(remote||[]).forEach(h=>{const l=m.get(h.id);if(!l||(h.updated||0)>(l.updated||0))m.set(h.id,h)});HIST=[...m.values()];persistLocal();renderHist()}

const SYNC={on:LS.get("coach_sync",false),token:null,exp:0,fileId:null,tc:null,busy:false};
function syncStat(t){$("#syncStat").textContent=t}
function loadGIS(){return new Promise((res,rej)=>{if(window.google&&google.accounts)return res();const s=document.createElement("script");s.src="https://accounts.google.com/gsi/client";s.onload=res;s.onerror=()=>rej(new Error("無法載入 Google 登入"));document.head.appendChild(s)})}
async function getToken(interactive,allowPopup){
  if(SYNC.token&&Date.now()<SYNC.exp-60000)return SYNC.token;
  if(!allowPopup)throw new Error("授權已過期，請按「立即同步」");
  if(!GCLIENT||GCLIENT.startsWith("__"))throw new Error("同步尚未設定（缺 Google Client ID）");
  await loadGIS();
  return await new Promise((res,rej)=>{
    SYNC.tc=google.accounts.oauth2.initTokenClient({client_id:GCLIENT,scope:"https://www.googleapis.com/auth/drive.appdata",
      callback:r=>{if(r.error){rej(new Error(r.error));return}SYNC.token=r.access_token;SYNC.exp=Date.now()+(r.expires_in||3600)*1000;res(SYNC.token)},
      error_callback:e=>rej(new Error(e.type||"popup"))});
    SYNC.tc.requestAccessToken({prompt:interactive?"consent":""});
  });
}
async function gfetch(url,opt={}){const t=await getToken(false,false);opt.headers=Object.assign({Authorization:"Bearer "+t},opt.headers||{});const r=await fetch(url,opt);if(!r.ok)throw new Error("Drive "+r.status);return r}
async function findFile(){if(SYNC.fileId)return SYNC.fileId;const r=await gfetch("https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id)&q="+encodeURIComponent("name='coach-data.json'"));const j=await r.json();SYNC.fileId=j.files&&j.files[0]?j.files[0].id:null;return SYNC.fileId}
async function syncPull(){
  if(SYNC.busy)return;SYNC.busy=true;syncStat("同步中…");
  try{const id=await findFile();
    if(id){const d=await (await gfetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`)).json();
      if(d.key&&!LS.get("coach_key","")){LS.set("coach_key",d.key);refreshKeyCard()}
      mergeHist(d.sessions)}
    SYNC.busy=false;await syncPush();
  }catch(e){syncStat("同步失敗："+e.message)}finally{SYNC.busy=false}
}
async function syncPush(){
  if(SYNC.busy)return;SYNC.busy=true;
  try{const body=JSON.stringify({v:1,updated:Date.now(),key:LS.get("coach_key",""),sessions:HIST});const id=await findFile();
    if(id)await gfetch(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`,{method:"PATCH",headers:{"Content-Type":"application/json"},body});
    else{const fd=new FormData();fd.append("metadata",new Blob([JSON.stringify({name:"coach-data.json",parents:["appDataFolder"]})],{type:"application/json"}));fd.append("file",new Blob([body],{type:"application/json"}));
      const r=await gfetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id",{method:"POST",body:fd});SYNC.fileId=(await r.json()).id}
    {const n=new Date();syncStat("已同步 "+String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0"))}
  }catch(e){syncStat("同步失敗："+e.message)}finally{SYNC.busy=false}
}
function syncUI(){$("#btnSync").textContent=SYNC.on?"立即同步":"連結 Google 帳號";$("#btnSyncOff").classList.toggle("hide",!SYNC.on);if(!SYNC.on)syncStat("未連結（紀錄只存在這台裝置）")}
$("#btnSync").onclick=async()=>{try{await getToken(!SYNC.on,true);SYNC.on=true;LS.set("coach_sync",true);syncUI();await syncPull()}catch(e){syncStat("連結失敗："+e.message)}};
$("#btnSyncOff").onclick=()=>{SYNC.on=false;SYNC.token=null;SYNC.fileId=null;LS.set("coach_sync",false);syncUI()};
syncUI();renderHist();setResume(CFG.resumeId);if(SYNC.on)syncStat("按「立即同步」載入其他裝置的紀錄");
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
let installEvt=null;window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e;const b=document.createElement("button");b.className="sm";b.id="btnInstall";b.textContent="安裝 App";b.onclick=async()=>{installEvt.prompt();await installEvt.userChoice;b.remove()};document.querySelector(".top").appendChild(b)});
if(!window.isSecureContext)sys("這個頁面需要用 https 開啟才能使用麥克風。",true);
</script>
